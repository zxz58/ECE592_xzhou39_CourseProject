seed: 123

simulator:
  population: 100000
  initial_exposed: 20
  initial_infectious: 10
  beta_base: 0.30
  beta_surge: 0.65
  sigma: 0.1923
  gamma: 0.1429

surrogate:
  beta_hat: 0.30
  sigma_hat: 0.1923
  gamma_hat: 0.1429

environment:
  forecast_horizon: 7
  recalibration_budget: 6
  error_metric: mae
  error_history_length: 14
  immediate_error_weight: 0.3
  path_error_weight: 0.7
  extinction_threshold: 1
  extinction_patience: 7
  min_steps_before_extinction_check: 14
  state_features:
    - normalized_compartments
    - recent_errors
    - rolling_mean_forecast_error
    - rolling_error_trend
    - remaining_budget
    - days_since_recalibration

dqn:
  training_seeds: [123, 456, 789]
  training_episodes: 500
  batch_size: 64
  replay_capacity: 20000
  gamma: 0.98
  learning_rate: 0.001
  hidden_dim: 64
  min_replay_size: 500
  target_update_interval: 200
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 8000

evaluation:
  episodes: 100
  epidemic_seed_base: 10000
  trajectory_seed_base: 1000000
  thresholds: [0.003, 0.005]
  threshold_cooldown: 7

tiers:
  fixed:
    termination_mode: fixed_horizon
    episode_length: 160
    max_steps: 160
    fixed_days: [40, 60, 80, 100, 120, 140]
  random:
    termination_mode: epidemic
    episode_length: 240
    max_steps: 240
    fixed_days: [30, 60, 90, 120, 150, 180]

outputs:
  results_dir: results/course_project
